[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-face-cloud"
version = "0.1.0"
description = "Constrained relative coordinate construction and geometry analysis for sequential tunnel face point clouds."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "laspy>=2.5",
  "lazrs>=0.6",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
open3d = ["open3d>=0.18"]
e57 = ["pye57>=0.4"]

[project.scripts]
tunnel-cloud = "tunnel_cloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
